<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon: tipe disesuaikan dengan format file (webp) -->
    <link rel="icon" type="image/webp" href="/obclogo.webp" />
    <link rel="apple-touch-icon" href="/obclogo.webp" />
    <meta name="theme-color" content="#404F14" />

    <!-- SEO dasar -->
    <title>OBC GROUP — Onny Barber Center Bandung</title>
    <meta
      name="description"
      content="OBC Group, grup usaha jasa di Bandung sejak 1999: OBC Sport Center, Guest House, Villa, Penthouse, Laundry, Food Court & Coffee. Booking lapangan & sewa gedung."
    />
    <meta
      name="keywords"
      content="OBC Group, Onny Barber Center, OBC Sport Center, OBC Guest House, OBC Villa, OBC Penthouse, OBC Laundry, OBC Food Court, OBC Coffee, sewa gedung Bandung, Ciumbuleuit"
    />
    <meta name="author" content="PT. Onny Barber Center" />
    <!-- TODO: ganti dengan domain asli OBC Group -->
    <link rel="canonical" href="https://obcgroup.com/" />

    <!-- Open Graph: dipakai WhatsApp, Facebook, Telegram, LinkedIn saat link dibagikan -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OBC GROUP" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://obcgroup.com/" />
    <meta property="og:title" content="OBC GROUP — Onny Barber Center, Bandung" />
    <meta
      property="og:description"
      content="Grup usaha jasa di Bandung sejak 1999: Sport Center, Guest House, Villa, Penthouse, Laundry, Food Court & Coffee. Sewa gedung & booking lapangan online."
    />
    <!-- Wajib URL absolut (https://...), bukan path relatif. Ukuran ideal 1200x630, di bawah 300 KB -->
    <meta property="og:image" content="https://obcgroup.com/obclogo.webp" />
    <meta property="og:image:secure_url" content="https://obcgroup.com/obclogo.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OBC GROUP — Onny Barber Center, Bandung" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OBC GROUP — Onny Barber Center, Bandung" />
    <meta
      name="twitter:description"
      content="Grup usaha jasa di Bandung sejak 1999: Sport Center, Guest House, Villa, Penthouse, Laundry, Food Court & Coffee."
    />
    <meta name="twitter:image" content="https://obcgroup.com/obclogo.webp" />

    <!-- Structured data (JSON-LD) agar Google memahami profil perusahaan -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PT. Onny Barber Center (OBC Group)",
        "url": "https://obcgroup.com/",
        "logo": "https://obcgroup.com/obclogo.webp",
        "foundingDate": "1999-05-07",
        "telephone": "+62-888-6070-900",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Jl. Rancabentang I No. 12, Ciumbuleuit",
          "addressLocality": "Bandung",
          "addressRegion": "Jawa Barat",
          "addressCountry": "ID"
        }
      }
    </script>

    <!-- Preload font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
